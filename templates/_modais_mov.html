{# Janela de movimentação (entrada / saída / ajuste), usada em Estoque e Movimentações #}
<div class="modal" id="modalMov" role="dialog" aria-modal="true" aria-labelledby="movTitulo">
    <div class="modal-box">
        <h3 id="movTitulo">Nova movimentação</h3>
        <form class="modal-body" id="formMov" autocomplete="off" novalidate>
            <label>Tipo</label>
            <div class="seg" id="movTipo" role="radiogroup" aria-label="Tipo de movimentação">
                <label><input type="radio" name="tipo" value="ENTRADA" checked>Entrada</label>
                <label><input type="radio" name="tipo" value="SAIDA">Saída</label>
                <label><input type="radio" name="tipo" value="AJUSTE">Ajuste (contagem)</label>
            </div>

            <label for="movItem">Item</label>
            <select id="movItem" class="input" required></select>
            <div class="hint" id="movSaldoInfo"></div>

            <div class="grid-2">
                <div id="gQtde"><label for="movQtde" id="lblQtde">Quantidade</label><input id="movQtde" class="input" inputmode="decimal" placeholder="0"></div>
                <div id="gValor"><label for="movValor">Valor unitário (R$)</label><input id="movValor" class="input" inputmode="decimal" placeholder="0,00"></div>
                <div id="gContado" hidden><label for="movContado">Saldo contado (físico)</label><input id="movContado" class="input" inputmode="decimal" placeholder="0"></div>
                <div><label for="movData">Data</label><input id="movData" class="input" type="date"></div>
            </div>
            <div class="grid-2">
                <div><label for="movDoc" id="lblDoc">Documento (NF, nota de entrega)</label><input id="movDoc" class="input" maxlength="60"></div>
                <div><label for="movContra" id="lblContra">Fornecedor</label><input id="movContra" class="input" maxlength="100"></div>
            </div>
            <label for="movObs" id="lblObs">Observações</label>
            <input id="movObs" class="input" maxlength="300">
            <div class="item-total" id="movResumo" hidden></div>
            <div class="alert-error" id="movErro" role="alert" hidden><div></div></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" id="movCancelar">Cancelar</button>
                <button type="submit" class="btn btn-primary" id="movSalvar">Registrar</button>
            </div>
        </form>
    </div>
</div>
